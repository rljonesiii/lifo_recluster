# Namespace for the jobs, and the service account the Spark driver uses to start executors.
apiVersion: v1
kind: Namespace
metadata:
  name: lifo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: lifo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: lifo
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: lifo
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: lifo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver
