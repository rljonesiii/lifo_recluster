# The same build every night (UTC). Forbid keeps one writer at a time, which Delta's default
# S3 log store requires; don't run lifo-build by hand while this one is running.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: lifo-rebuild
  namespace: lifo
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 3
  failedRunHistoryLimit: 5
  template:
    type: Python
    mode: cluster
    sparkVersion: "4.0.5"
    image: registry.example.com/lifo-spark:0.1.0
    imagePullPolicy: IfNotPresent
    mainApplicationFile: local:///opt/lifo/jobs/lifo_spark/build.py
    arguments:
      - --transfers=s3a://lifo-lake/input/transfers
      - --sources=s3a://lifo-lake/input/sources
      - --membership=s3a://lifo-lake/input/membership
      - --out=s3a://lifo-lake/trace
      - --checkpoint-dir=s3a://lifo-lake/checkpoints/rebuild
      - --partitions=2048
      - --buckets=256
      - --labels-checkpoint-every=1  # raise it to rewrite the labels table less often
      - --hot-key-rows=1000000       # keys with more rows join by broadcast
      - --chunk-events=10000000      # clusters with more events sweep in chunks
      - --balance-bins=4096          # running balances in time bins
    sparkConf:
      spark.sql.extensions: io.delta.sql.DeltaSparkSessionExtension
      spark.sql.catalog.spark_catalog: org.apache.spark.sql.delta.catalog.DeltaCatalog
      spark.sql.shuffle.partitions: "2048"
      spark.sql.execution.arrow.maxRecordsPerBatch: "100000"
      spark.cleaner.referenceTracking.cleanCheckpoints: "true"
      spark.kubernetes.driver.secretKeyRef.AWS_ACCESS_KEY_ID: lifo-object-store:access-key
      spark.kubernetes.driver.secretKeyRef.AWS_SECRET_ACCESS_KEY: lifo-object-store:secret-key
      spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID: lifo-object-store:access-key
      spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY: lifo-object-store:secret-key
    hadoopConf:
      fs.s3a.endpoint: http://minio.lifo.svc.cluster.local:9000
      fs.s3a.endpoint.region: us-east-1
      fs.s3a.path.style.access: "true"
      fs.s3a.connection.ssl.enabled: "false"
    restartPolicy:
      type: OnFailure
      onFailureRetries: 2
      onFailureRetryInterval: 60
      onSubmissionFailureRetries: 2
      onSubmissionFailureRetryInterval: 60
    driver:
      serviceAccount: spark
      cores: 2
      memory: 8g
    executor:
      instances: 16
      cores: 4
      memory: 24g
      memoryOverhead: 8g
