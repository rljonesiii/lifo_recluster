# Credentials for the S3-compatible store that holds the lake (MinIO, Ceph, or S3 with keys).
# Copy, fill in, apply once, and keep the filled-in copy out of version control.
# On AWS, prefer workload identity (IRSA) over keys: see the README.
apiVersion: v1
kind: Secret
metadata:
  name: lifo-object-store
  namespace: lifo
type: Opaque
stringData:
  access-key: CHANGE-ME
  secret-key: CHANGE-ME
